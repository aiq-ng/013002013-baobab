[build]
  command = "npm run build"
  publish = "dist/baobab/browser"
  # trigger a fresh deploy

[[plugins]]
  package = "@netlify/angular-runtime"

# Registry Console hardening — mirrors src/app/core/security/console-security-headers.ts, which
# applies the same set to responses rendered by the Angular server handler.
[[headers]]
  for = "/console/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

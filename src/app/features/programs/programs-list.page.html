<article>
  <app-programs-hero />
  <app-trust-band />
  <app-strategic-pillars appScrollReveal />

  <section class="mx-auto max-w-7xl px-4 pb-16" appScrollReveal>
    <app-eyebrow text="PROGRAMS AND SERVICES" />
    <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">
      Active Programs &amp; Theaters
    </h2>

    <div class="mt-10">
      <app-program-grid [programs]="activePrograms()" />
      @if (programsUnavailable()) {
        <p class="text-sm text-slate-600">
          Programs are temporarily unavailable. Please try again in a moment.
        </p>
      }
    </div>
  </section>

  <app-dispatch-form
    appScrollReveal
    variant="subscribe"
    heading="Receive new publications and updates from The Baobab Group."
    protocolId="BB-PROGRAMS-GENERAL"
    source="programs-sovereign-dialogue"
  />
</article>

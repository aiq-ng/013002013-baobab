<article>
  <app-programs-hero />
  <app-strategic-pillars />

  <section class="mx-auto max-w-7xl px-4 pb-16">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div>
        <app-eyebrow text="CONFIDENTIAL FIELD DOSSIERS" />
        <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">
          Active Programs &amp; Theaters
        </h2>
      </div>
      <p class="max-w-sm text-sm text-slate-600 sm:text-base">
        Field-level customary accords ratified jointly with national ministerial observers and
        sovereign pastoral councils.
      </p>
    </div>

    <div class="mt-10">
      <app-program-grid [programs]="activePrograms" />
    </div>
  </section>

  <app-programs-theater-section />

  <app-dispatch-form
    heading="Receive Verified Field Dispatches &amp; Bi-Weekly Corridor Updates"
    subtext="Directly transmitted from Secretariat field monitors in Gao, Diffa, and Tamale. Objective, de-classified peacecraft telemetry distributed exclusively to accredited diplomatic delegations and multilateral researchers."
    protocolId="BB-PROGRAMS-GENERAL"
    source="programs-sovereign-dialogue"
  />
</article>

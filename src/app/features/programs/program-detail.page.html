@if (program) {
  <article>
    <app-program-header [title]="program.title" [description]="program.description" />

    <app-strategic-pillars [showHeading]="false" />

    <app-program-about
      appScrollReveal
      [title]="program.title"
      [badgeText]="program.badgeText"
      [imageUrl]="program.imageUrl"
      [imageAlt]="program.imageAlt"
      [paragraphs]="program.aboutParagraphs"
    />

    <app-program-strategy
      appScrollReveal
      [keyPoints]="program.keyPoints"
      [heading]="program.strategyHeading"
      [expectedImpact]="program.expectedImpact"
      [imageUrl]="program.strategyImageUrl"
      [imageAlt]="program.strategyImageAlt"
    />

    <app-dispatch-form
      appScrollReveal
      variant="subscribe"
      heading="Receive new publications and updates from The Baobab Group."
      [protocolId]="program.slug"
      source="program-confidential-dispatch"
    />
  </article>
} @else {
  <section class="mx-auto max-w-7xl px-4 py-24 text-center">
    <h1 class="text-2xl font-bold text-ink-950">This program is temporarily unavailable</h1>
    <p class="mt-3 text-sm text-slate-600">Please try again in a moment.</p>
    <div class="mt-6 flex justify-center">
      <app-back-link routerLink="/programs" label="All programs" />
    </div>
  </section>
}

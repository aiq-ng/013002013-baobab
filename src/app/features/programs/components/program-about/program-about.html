<section class="bg-surface-tint">
  <div
    appStaggerReveal
    class="mx-auto grid max-w-7xl grid-cols-1 gap-10 px-4 py-14 md:grid-cols-2 md:items-center md:gap-12 md:py-20"
  >
    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-card shadow-sm">
      <img
        [ngSrc]="imageUrl"
        [alt]="imageAlt"
        fill
        loading="lazy"
        appImgFadeIn
        class="object-cover"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-ink-950/80 via-ink-950/20 to-transparent"
      ></div>
      <div class="absolute inset-x-0 bottom-0 flex flex-col items-start gap-2 p-6">
        <app-badge [text]="badgeText" />
        <p class="text-lg font-semibold text-white sm:text-xl">{{ title }}</p>
      </div>
    </div>

    <div>
      <app-eyebrow [text]="title" />
      <h2 class="mt-3 text-2xl font-bold tracking-tight text-ink-950 sm:text-3xl">
        About this program:
      </h2>
      <div class="mt-5 space-y-5 text-sm leading-relaxed text-slate-600 sm:text-base">
        @for (paragraph of paragraphs; track $index) {
          <p data-testid="about-paragraph">{{ paragraph }}</p>
        }
      </div>
    </div>
  </div>
</section>

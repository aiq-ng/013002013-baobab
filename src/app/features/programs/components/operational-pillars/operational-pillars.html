<section class="mx-auto max-w-7xl px-4 py-16">
  <p class="text-xs font-semibold uppercase tracking-wide text-brand-700">{{ eyebrow }}</p>
  <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl">{{ heading }}</h2>
  <p class="mt-3 max-w-2xl text-sm text-slate-600 sm:text-base">{{ description }}</p>

  <div class="mt-10 grid grid-cols-1 gap-8 sm:grid-cols-3">
    @for (pillar of pillars; track $index) {
      <div>
        <span
          class="flex h-12 w-12 items-center justify-center rounded-lg bg-brand-50"
          aria-hidden="true"
        >
          <svg
            class="h-5 w-5 text-brand-700"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.75"
          >
            @switch (iconKey(pillar)) {
              @case ('clock') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 7v5l3.5 2M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"
                />
              }
              @case ('handshake') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 11l4-4 5 4 3-3 6 6-3 3-2-2-3 3-3-3-2 2-5-5z"
                />
              }
              @case ('shield') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3l7 3v5c0 4.5-3 8.25-7 9.5-4-1.25-7-5-7-9.5V6l7-3z"
                />
              }
              @case ('speech') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v11H8l-4 4V5z" />
              }
              @case ('clipboard') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM6 6h12v14H6V6zM9 11h6M9 15h6"
                />
              }
              @case ('signal') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 19v-6M8.5 15.5a5 5 0 0 1 7 0M5.5 12.5a9 9 0 0 1 13 0M12 19.01l.01-.01"
                />
              }
              @case ('building') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 21V9l8-5 8 5v12M4 21h16M9 21v-6h6v6"
                />
              }
              @case ('calendar') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 4v3M18 4v3M4 9h16M5 7h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"
                />
              }
              @case ('leaf') {
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16zM4 20l7-7"
                />
              }
            }
          </svg>
        </span>
        <p class="mt-4 text-xs font-semibold uppercase tracking-wide text-brand-700">
          {{ pillar.eyebrow }}
        </p>
        <h3 class="mt-1 text-lg font-semibold text-ink-950">{{ pillar.title }}</h3>
        <p class="mt-2 text-sm text-ink-950/70">{{ pillar.description }}</p>
        <p class="mt-3 text-xs font-medium text-ink-950/50">✓ {{ pillar.footnote }}</p>
      </div>
    }
  </div>
</section>

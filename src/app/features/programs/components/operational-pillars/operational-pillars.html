<section class="mx-auto max-w-7xl px-4 py-16">
  <p class="text-xs font-semibold uppercase tracking-wide text-brand-700">{{ eyebrow }}</p>
  <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl">{{ heading }}</h2>
  <p class="mt-3 max-w-2xl text-sm text-slate-600 sm:text-base">{{ description }}</p>

  <div class="mt-10 grid grid-cols-1 gap-8 sm:grid-cols-3">
    @for (pillar of pillars; track pillar.eyebrow) {
      <div>
        <span
          class="flex h-10 w-10 items-center justify-center rounded-full bg-surface-tint text-lg"
          aria-hidden="true"
          >{{ pillar.icon }}</span
        >
        <p class="mt-4 text-xs font-semibold uppercase tracking-wide text-brand-700">
          {{ pillar.eyebrow }}
        </p>
        <h3 class="mt-1 text-lg font-semibold text-ink-950">{{ pillar.title }}</h3>
        <p class="mt-2 text-sm text-ink-950/70">{{ pillar.description }}</p>
        <p class="mt-3 text-xs font-medium text-ink-950/50">✓ {{ pillar.footnote }}</p>
      </div>
    }
  </div>
</section>

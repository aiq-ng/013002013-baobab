<section class="bg-surface-tint">
  <div class="mx-auto grid max-w-7xl grid-cols-1 gap-10 px-4 py-16 lg:grid-cols-2 lg:gap-16">
    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-card">
      <img [ngSrc]="imageUrl" [alt]="imageCaption" fill loading="lazy" class="object-cover" />
      <p
        class="absolute inset-x-0 bottom-0 bg-ink-950/70 px-4 py-2 text-xs font-medium uppercase tracking-wide text-white"
      >
        {{ imageCaption }}
      </p>
    </div>

    <div>
      <p
        class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-brand-700"
      >
        <span aria-hidden="true" class="h-px w-6 bg-brand-700"></span>
        {{ eyebrow }}
      </p>
      <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl">{{ heading }}</h2>

      <div class="mt-4 flex flex-col gap-4 text-sm text-ink-950/70 sm:text-base">
        @for (paragraph of paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>

      <dl class="mt-8 grid grid-cols-3 gap-4 border-t border-ink-950/10 pt-6">
        @for (stat of stats; track stat.label) {
          <div>
            <dd class="text-xl font-bold text-brand-700 sm:text-2xl">
              {{ stat.value }}{{ stat.unit ? ' ' + stat.unit : '' }}
            </dd>
            <dt class="mt-1 text-xs text-ink-950/60">{{ stat.label }}</dt>
          </div>
        }
      </dl>
    </div>
  </div>
</section>

<section class="mx-auto max-w-7xl px-4 py-16">
  <div class="relative overflow-hidden rounded-card bg-ink-950 px-6 py-12 text-white sm:px-12">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <p
        class="inline-flex items-center gap-2 rounded-full bg-brand-600/20 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-brand-300"
      >
        Diplomatic Dispatches
      </p>
      <p class="text-xs text-white/50">Protocol ID: {{ protocolId }}</p>
    </div>

    <h2 class="mt-6 max-w-xl text-2xl font-bold sm:text-3xl">{{ heading }}</h2>
    <p class="mt-3 max-w-xl text-sm text-white/70">{{ subtext }}</p>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="mt-8 flex w-full max-w-lg flex-col gap-3 sm:flex-row sm:items-start"
    >
      <div class="flex-1">
        <label for="dispatch-email" class="sr-only">Delegation official email</label>
        <input
          id="dispatch-email"
          type="email"
          formControlName="email"
          placeholder="Enter delegation official email (e.g. name@diplomatie.gouv.ml)"
          class="w-full rounded-full border border-white/20 bg-white/10 px-4 py-3 text-sm text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-brand-400"
        />
        @if (errorFor('email')) {
          <p role="alert" class="mt-2 text-sm text-red-300">{{ errorFor('email') }}</p>
        }
      </div>
      <app-button label="Request Dispatches" type="submit" variant="primary" />
    </form>

    <ul class="mt-6 flex flex-wrap gap-x-6 gap-y-2 text-xs text-white/60">
      <li>🛡️ Encrypted Delivery</li>
      <li>🕒 Vetted within 4 Hours</li>
      <li>✅ Ministry Clearance Required</li>
    </ul>
  </div>
</section>

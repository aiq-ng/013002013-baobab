<header class="border-b border-slate-100">
  <div class="mx-auto max-w-7xl px-4 pt-10 pb-8 sm:pt-14">
    <nav aria-label="Breadcrumb" class="text-sm text-ink-950/80">
      <ol class="flex flex-wrap items-center gap-1">
        <li><a routerLink="/programs" class="hover:text-brand-700">Programs</a></li>
        <li aria-hidden="true">›</li>
        <li aria-current="page" class="font-medium text-brand-700">{{ title }}</li>
      </ol>
    </nav>
    <h1 class="mt-5 text-3xl font-bold tracking-tight text-ink-950 sm:text-4xl md:text-5xl">
      {{ title }}
    </h1>
    <p class="mt-3 max-w-4xl text-base text-slate-600 sm:text-lg">{{ description }}</p>
  </div>
</header>

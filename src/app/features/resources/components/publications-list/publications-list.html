<section class="mx-auto max-w-7xl px-4 py-16 sm:px-8">
  <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:gap-16">
    <div class="max-w-xl">
      <p class="text-xs font-semibold uppercase tracking-wide text-brand-700">Baobab Depository</p>
      <h2 class="mt-2 text-2xl font-bold text-ink-950 sm:text-3xl">All publications</h2>
      <p class="mt-2 text-sm text-slate-600 sm:text-base">
        Bilateral instruments, inter-community grazing compacts, and riparian water pacts enacted
        under dual civil-customary authority.
      </p>
    </div>
    <span
      class="self-start rounded-full bg-brand-700 px-4 py-2 text-sm font-medium text-white lg:self-center"
    >
      All documents
    </span>
  </div>

  @if (documents().length) {
    <ul class="mt-10 space-y-5">
      @for (document of documents(); track document.id) {
        <li><app-publication-card [document]="document" /></li>
      }
    </ul>
  } @else {
    <app-status-panel
      class="mt-10 block"
      title="No publications yet"
      message="New publications will appear here as soon as they are released."
    />
  }
</section>

<div class="flex h-full flex-col rounded-card bg-white p-6 shadow-sm ring-1 ring-ink-950/5">
  <span
    aria-hidden="true"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-100 text-brand-700"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="h-4 w-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v13H7z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5M9 13h6M9 17h6" />
    </svg>
  </span>
  <h3 class="mt-4 text-lg font-bold text-ink-950">Sovereign Addendum Dispatch</h3>
  <p class="mt-2 text-sm text-ink-950/60">
    Direct distribution of real-time legal appendices, corridor boundary maps, and emergency
    mediation alerts delivered directly to accredited desk officers.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-3">
    <div>
      <label for="addendum-email" class="mb-1 block text-xs font-semibold text-ink-950/70">
        Institutional / Delegation Email
      </label>
      <input
        id="addendum-email"
        type="email"
        formControlName="email"
        placeholder="name@mfa.gov or un.org"
        class="w-full rounded-full border border-ink-950/15 bg-surface-tint px-4 py-3 text-sm text-ink-950 placeholder:text-ink-950/40 focus:outline-none focus:ring-2 focus:ring-brand-500"
      />
      @if (errorFor('email')) {
        <p role="alert" class="mt-2 text-sm text-red-600">{{ errorFor('email') }}</p>
      }
    </div>
    <app-button label="Submit for Addendums →" type="submit" variant="primary" />
  </form>
</div>

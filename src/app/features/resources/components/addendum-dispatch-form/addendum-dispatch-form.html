<div class="flex flex-col">
  <span
    aria-hidden="true"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-100 text-brand-700"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="h-4 w-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 3h7l5 5v13H7z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5M9 13h6M9 17h6" />
    </svg>
  </span>
  <h3 class="mt-4 text-lg font-bold tracking-tight text-ink-950">Sovereign Addendum Dispatch</h3>
  <p class="mt-2 text-sm leading-relaxed text-ink-950/60">
    Direct distribution of real-time legal appendices, corridor boundary maps, and emergency
    mediation alerts delivered directly to accredited desk officers.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
    <app-form-field
      label="Institutional / Delegation Email"
      inputId="addendum-email"
      [errorMessage]="errorFor('email')"
    >
      <input
        id="addendum-email"
        type="email"
        formControlName="email"
        placeholder="name@mfa.gov or un.org"
        class="field-input"
      />
    </app-form-field>

    @if (errorMessage()) {
      <p role="alert" class="text-sm text-red-600">{{ errorMessage() }}</p>
    }
    <app-button
      [label]="submitting() ? 'Sending…' : 'Submit for Addendums →'"
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [disabled]="submitting()"
    />
  </form>
</div>

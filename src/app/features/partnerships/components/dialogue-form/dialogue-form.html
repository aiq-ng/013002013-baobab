<section class="mx-auto max-w-7xl px-4 pb-16">
  <div class="rounded-card bg-surface-tint px-4 py-12 text-center sm:px-8 lg:px-12">
    <h2 class="mx-auto max-w-xl text-2xl font-bold text-ink-950 sm:text-3xl">
      Start a conversation
    </h2>
    <p class="mx-auto mt-3 max-w-xl text-sm text-ink-950/60 sm:text-base">
      Tell us who you are and how you would like to work together.
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="mx-auto mt-8 flex w-full max-w-lg flex-col gap-3 sm:flex-row sm:items-start"
    >
      <div class="flex-1 text-left">
        <label for="partnerships-dialogue-email" class="sr-only"> Your email address </label>
        <input
          id="partnerships-dialogue-email"
          type="email"
          formControlName="email"
          placeholder="Your email address…."
          class="w-full rounded-full border border-ink-950/15 bg-white px-4 py-3 text-sm text-ink-950 placeholder:text-ink-950/40 focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
        @if (errorFor('email')) {
          <p role="alert" class="mt-2 text-sm text-red-600">{{ errorFor('email') }}</p>
        }
      </div>
      <app-button
        [label]="submitting() ? 'Sending…' : 'Send →'"
        type="submit"
        variant="primary"
        [disabled]="submitting()"
      />
    </form>
    @if (errorMessage()) {
      <p role="alert" class="mt-4 text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <p class="mt-8 text-xs text-ink-950/50">
      Together, we build a West Africa where peace takes root and future generations thrive.
    </p>
  </div>
</section>

<article>
  <app-home-hero />

  <app-trust-band />

  <app-mission-block appScrollReveal />
  <app-partner-categories appScrollReveal />
  <app-track-model appScrollReveal />
  <app-programs-preview appScrollReveal />
  <app-expected-impact appScrollReveal />

  <section class="mx-auto max-w-7xl px-4 pb-16" appScrollReveal>
    <app-cta-band
      heading="Peace is strongest when it is locally owned, nationally supported, and regionally sustained."
      subtext="Together, we build a West Africa where peace takes root and future generations thrive."
      backgroundImage="/images/home/last-section-bg.png"
      primaryLabel="Partner With Us →"
      primaryCtaId="home-closing-partner-with-us"
      secondaryLabel="Contact Us"
      secondaryRoute="/contact"
      secondaryCtaId="home-closing-contact-us"
      (primaryPressed)="showDialogueForm.set(true)"
    />
    @if (showDialogueForm()) {
      <app-dialogue-form />
    }
  </section>
</article>

<section class="mx-auto max-w-7xl px-4 py-16">
  <app-eyebrow text="WHAT WE CAN DO" />
  <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">Expected impact</h2>

  <ul class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (outcome of outcomes; track outcome.number) {
      <li class="rounded-card bg-surface-tint pad-card-sm text-center">
        <span
          aria-hidden="true"
          class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-200 text-brand-700"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-6 w-6"
          >
            @switch (outcome.icon) {
              @case ('handshake') {
                <path
                  d="M8.25 10.5 5.63 13.13a1.5 1.5 0 0 0 2.12 2.12l1.72-1.72m0 0 2.5 2.5a1.5 1.5 0 0 0 2.12-2.12l-3.86-3.86m-.76 3.86 3.57 3.57a1.5 1.5 0 0 0 2.12-2.12l-1.24-1.24M2.25 9l3.44-3.44a3 3 0 0 1 2.12-.88h1.38a3 3 0 0 1 2.12.88l1.19 1.19m9.5 2.25L18.44 5.56a3 3 0 0 0-2.12-.88h-1.38a3 3 0 0 0-2.12.88l-.94.94"
                />
              }
              @case ('cycle') {
                <path
                  d="M16.5 4.5 19.5 7.5 16.5 10.5M19.5 7.5H8.25A3.75 3.75 0 0 0 4.5 11.25v.75M7.5 19.5 4.5 16.5l3-3M4.5 16.5h11.25a3.75 3.75 0 0 0 3.75-3.75v-.75"
                />
              }
            }
          </svg>
        </span>
        <p class="mt-4 text-3xl font-bold text-ink-950">{{ outcome.number }}</p>
        <p class="mx-auto mt-1 max-w-[16rem] text-sm font-medium text-brand-700">
          {{ outcome.label }}
        </p>
      </li>
    }
  </ul>
</section>

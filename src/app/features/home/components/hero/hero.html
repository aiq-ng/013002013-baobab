<section class="relative isolate flex min-h-screen items-center overflow-hidden bg-ink-950">
  <img
    ngSrc="/images/home/hero-baobab-savanna.jpg"
    alt="A baobab tree at dawn over the Sahel savanna"
    fill
    priority
    appImgFadeIn
    class="object-cover"
  />
  <div class="absolute inset-0 bg-gradient-to-b from-ink-950/80 via-ink-950/50 to-ink-950/70"></div>

  <div class="relative mx-auto max-w-6xl px-4 py-16 text-center">
    <h1 class="text-4xl font-bold text-white sm:text-5xl md:text-6xl lg:text-7xl">
      Peace. Dialogue. Resilience.<br />
      For A Stronger West Africa.
    </h1>
    <p class="mx-auto mt-6 max-w-2xl text-base text-white/70 sm:text-lg">
      The Baobab Group is a pan-West African peacebuilding and mediation institution dedicated to
      strengthening peace and stability through non-kinetic approaches.
    </p>

    <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <app-button
        class="inline-block whitespace-nowrap"
        label="Our Programs →"
        variant="mint"
        routerLink="/programs"
        ctaId="home-hero-our-programs"
      />
      <app-button
        class="inline-block whitespace-nowrap"
        label="Contact Us"
        variant="outline-light"
        routerLink="/contact"
        ctaId="home-hero-contact-us"
      />
    </div>
  </div>
</section>

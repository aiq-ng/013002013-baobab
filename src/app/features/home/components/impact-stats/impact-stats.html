<section class="mx-auto max-w-7xl px-4 pb-16">
  <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats; track stat.label) {
      <div class="rounded-card bg-surface-tint p-6 text-center">
        <span
          aria-hidden="true"
          class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-200 text-brand-700"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-6 w-6"
          >
            @switch (stat.icon) {
              @case ('handshake') {
                <path
                  d="M8.25 10.5 5.63 13.13a1.5 1.5 0 0 0 2.12 2.12l1.72-1.72m0 0 2.5 2.5a1.5 1.5 0 0 0 2.12-2.12l-3.86-3.86m-.76 3.86 3.57 3.57a1.5 1.5 0 0 0 2.12-2.12l-1.24-1.24M2.25 9l3.44-3.44a3 3 0 0 1 2.12-.88h1.38a3 3 0 0 1 2.12.88l1.19 1.19m9.5 2.25L18.44 5.56a3 3 0 0 0-2.12-.88h-1.38a3 3 0 0 0-2.12.88l-.94.94"
                />
              }
              @case ('cycle') {
                <path
                  d="M16.5 4.5 19.5 7.5 16.5 10.5M19.5 7.5H8.25A3.75 3.75 0 0 0 4.5 11.25v.75M7.5 19.5 4.5 16.5l3-3M4.5 16.5h11.25a3.75 3.75 0 0 0 3.75-3.75v-.75"
                />
              }
              @case ('institution') {
                <path
                  d="M3 21h18M4.5 21V9.75L12 4.5l7.5 5.25V21M9 21v-6h6v6M12 4.5V3"
                />
              }
              @case ('document') {
                <path
                  d="M9 12.75 11.25 15l3.75-4.5M8.25 3.75h6.19a1.5 1.5 0 0 1 1.06.44l2.31 2.31a1.5 1.5 0 0 1 .44 1.06V19.5a1.5 1.5 0 0 1-1.5 1.5h-8.5a1.5 1.5 0 0 1-1.5-1.5V5.25a1.5 1.5 0 0 1 1.5-1.5Z"
                />
              }
            }
          </svg>
        </span>
        <dd [class]="'mt-4 text-3xl font-bold ' + stat.valueClass">{{ stat.value }}</dd>
        <dt [class]="'mt-1 text-sm font-semibold ' + stat.labelClass">{{ stat.label }}</dt>
        <p class="mt-1 text-xs text-slate-500">{{ stat.description }}</p>
      </div>
    }
  </dl>
</section>

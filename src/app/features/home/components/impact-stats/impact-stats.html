<section class="mx-auto max-w-7xl px-4 pb-16">
  <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats; track stat.label) {
      <div class="rounded-card bg-surface-tint p-6 text-center">
        <span
          aria-hidden="true"
          class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-100 text-brand-700"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            class="h-6 w-6"
          >
            <circle cx="12" cy="12" r="9" />
          </svg>
        </span>
        <dd [class]="'mt-4 text-3xl font-bold ' + stat.valueClass">{{ stat.value }}</dd>
        <dt [class]="'mt-1 text-sm font-semibold ' + stat.labelClass">{{ stat.label }}</dt>
        <p class="mt-1 text-xs text-slate-500">{{ stat.description }}</p>
      </div>
    }
  </dl>
</section>

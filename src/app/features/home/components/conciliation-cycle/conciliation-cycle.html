<section class="mx-auto max-w-7xl px-4 py-16">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-ink-950 sm:text-3xl">Integrated Conciliation Cycle</h2>
      <p class="mt-2 text-sm text-slate-600 sm:text-base">
        Continuous diplomatic feedback loops prevent accords from fracturing under regional
        friction.
      </p>
    </div>
    <app-badge text="Continuous Operational Feed" />
  </div>

  <ol class="mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (item of steps; track item.step) {
      <li class="rounded-card bg-surface-tint p-6">
        <span
          class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-sm font-bold text-brand-700"
        >
          {{ item.step }}
        </span>
        <h3 class="mt-4 text-base font-semibold text-ink-950">{{ item.title }}</h3>
        <p class="mt-2 text-sm text-slate-600">{{ item.description }}</p>
      </li>
    }
  </ol>
</section>

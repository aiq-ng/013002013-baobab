<section
  appStaggerReveal
  class="mx-auto grid max-w-7xl grid-cols-1 items-center gap-10 px-4 py-16 lg:grid-cols-2 lg:gap-16"
>
  <div>
    <app-eyebrow text="WHO WE ARE" />
    <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">
      We work across ECOWAS and AES countries.
    </h2>
    <p class="mt-6 text-sm text-slate-600 sm:text-base">
      We support sovereign dialogue, community resilience and hybrid mediation that deliver
      sustainable solutions to complex conflicts. Our work complements legitimate national security
      efforts and is led by the people it serves.
    </p>

    <app-button
      class="mt-8"
      label="About Us"
      variant="primary"
      routerLink="/about"
      ctaId="home-who-we-are-about"
      [fullWidth]="true"
    />
  </div>

  <img
    ngSrc="/images/home/spokesperson-portrait.jpg"
    alt="A senior representative in dialogue during a Baobab-mediated session"
    width="960"
    height="720"
    appImgFadeIn
    class="w-full rounded-card object-cover"
  />
</section>

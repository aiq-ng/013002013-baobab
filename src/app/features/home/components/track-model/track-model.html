<section class="mx-auto max-w-7xl px-4 py-16">
  <app-eyebrow text="SOVEREIGNTY MATRIX" />
  <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">Our response</h2>
  <p class="mt-4 max-w-2xl text-sm text-slate-600 sm:text-base">
    Our response is a dual-track peace architecture.
  </p>

  <div class="mt-10 grid grid-cols-1 gap-6 lg:grid-cols-3">
    @for (track of tracks; track track.title) {
      <div
        [class]="
          track.emphasized
            ? 'rounded-card bg-gradient-to-br from-brand-700 to-brand-900 p-6 text-white shadow-lg lg:p-8'
            : 'rounded-card border border-slate-100 p-6 shadow-sm lg:p-8'
        "
      >
        <div class="flex items-center justify-between">
          <span
            [class]="
              'inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wide ' +
              (track.emphasized ? 'bg-brand-500/40 text-brand-50' : 'bg-brand-100 text-brand-700')
            "
          >
            {{ track.eyebrow }}
          </span>
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            [class]="'h-6 w-6 ' + (track.emphasized ? 'text-brand-300' : 'text-slate-600')"
          >
            @switch (track.icon) {
              @case ('institution') {
                <path d="M3 21h18M4.5 21V9.75L12 4.5l7.5 5.25V21M8 21v-8M12 21v-8M16 21v-8" />
              }
              @case ('network') {
                <path
                  d="M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM12 3v6.5M12 14.5V21M4.2 7.5l5.6 3.2M14.2 13.3l5.6 3.2M4.2 16.5l5.6-3.2M14.2 10.7l5.6-3.2"
                />
              }
              @case ('community') {
                <path
                  d="M15 19.13a9.38 9.38 0 0 0 2.63.37 9.34 9.34 0 0 0 4.12-.95 4.13 4.13 0 0 0-7.53-2.49M15 19.13v-.01c0-1.11-.29-2.16-.79-3.07M15 19.13v.1A12.32 12.32 0 0 1 8.62 21c-2.33 0-4.51-.64-6.37-1.77v-.11a6.38 6.38 0 0 1 11.96-3.07M12 6.38a3.38 3.38 0 1 1-6.75 0 3.38 3.38 0 0 1 6.75 0Zm8.25 2.25a2.63 2.63 0 1 1-5.25 0 2.63 2.63 0 0 1 5.25 0Z"
                />
              }
            }
          </svg>
        </div>

        <h3
          [class]="'mt-4 text-xl font-bold ' + (track.emphasized ? 'text-white' : 'text-ink-950')"
        >
          {{ track.title }}
        </h3>
        <p [class]="'mt-3 text-sm ' + (track.emphasized ? 'text-brand-50/90' : 'text-slate-600')">
          {{ track.description }}
        </p>
      </div>
    }
  </div>

  <img
    ngSrc="/images/home/response-banner-market.jpg"
    alt="A busy West African market street crowded with buses, taxis and traders"
    width="1374"
    height="218"
    loading="lazy"
    appImgFadeIn
    class="mt-16 h-32 w-full object-cover sm:h-44 lg:h-auto"
  />
</section>

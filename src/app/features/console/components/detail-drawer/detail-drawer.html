<app-drawer [open]="submission() !== null" label="Submission detail" (closed)="dismiss()">
  @if (submission(); as s) {
    <dl class="space-y-4 text-sm">
      <div>
        <dt class="font-medium text-slate-500">Reference</dt>
        <dd class="text-ink-950">{{ s.referenceId }}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-500">Source</dt>
        <dd class="text-ink-950">{{ s.source }}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-500">Name</dt>
        <dd class="text-ink-950">{{ s.name }}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-500">Email</dt>
        <dd class="text-ink-950">{{ s.email }}</dd>
      </div>
      @if (s.message) {
        <div>
          <dt class="font-medium text-slate-500">Message</dt>
          <dd class="whitespace-pre-wrap text-ink-950">{{ s.message }}</dd>
        </div>
      }
      <div>
        <dt class="font-medium text-slate-500">Submitted</dt>
        <dd class="text-ink-950">{{ s.submittedAt }}</dd>
      </div>
    </dl>

    <div class="mt-8">
      <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Status</h3>
      <div class="mt-2 flex flex-wrap gap-2">
        @for (status of statusOptions; track status) {
          <button
            type="button"
            (click)="setStatus(status)"
            [attr.aria-pressed]="s.status === status"
            class="rounded-full px-3 py-1.5 text-xs font-medium capitalize transition-colors"
            [class.bg-console-accent]="s.status === status"
            [class.text-white]="s.status === status"
            [class.bg-slate-100]="s.status !== status"
            [class.text-slate-600]="s.status !== status"
          >
            {{ status }}
          </button>
        }
      </div>
    </div>
  }
</app-drawer>

<app-drawer [open]="submission() !== null" label="Submission detail" (closed)="dismiss()">
  @if (submission(); as s) {
    <p class="console-eyebrow">{{ humanize(s.source) }}</p>
    <p class="mt-1 text-xl font-semibold text-ink-950">{{ s.name }}</p>
    <p class="text-sm text-console-muted">{{ s.referenceId }}</p>

    <dl class="mt-6 divide-y divide-console-line rounded-xl border border-console-line text-sm">
      <div class="flex flex-col gap-0.5 px-4 py-3 sm:flex-row sm:gap-4">
        <dt class="w-28 shrink-0 text-console-muted">Email</dt>
        <dd class="min-w-0 break-words">
          <a [href]="mailto(s)" class="console-link">{{ s.email }}</a>
        </dd>
      </div>
      <div class="flex flex-col gap-0.5 px-4 py-3 sm:flex-row sm:gap-4">
        <dt class="w-28 shrink-0 text-console-muted">Submitted</dt>
        <dd class="text-ink-950">
          <time [attr.datetime]="s.submittedAt">{{ formatDateTime(s.submittedAt) }}</time>
        </dd>
      </div>
    </dl>

    @if (s.message) {
      <h3 class="console-label mt-6">Message</h3>
      <!-- Bound via textContent so template formatting can never leak into pre-wrapped text. -->
      <p
        class="rounded-xl bg-surface-muted px-4 py-3 text-sm leading-relaxed break-words text-ink-950"
      >
        <span
          data-testid="submission-message"
          class="whitespace-pre-wrap"
          [textContent]="s.message"
        ></span>
      </p>
    }

    <div class="mt-8">
      <h3 id="status-heading" class="console-label">Status</h3>
      <div
        class="flex flex-wrap gap-2"
        role="group"
        aria-labelledby="status-heading"
        [attr.aria-busy]="busy() ? 'true' : null"
      >
        @for (status of statusOptions; track status) {
          <button
            type="button"
            class="console-chip capitalize"
            (click)="setStatus(status)"
            [disabled]="busy()"
            [attr.aria-pressed]="s.status === status"
          >
            {{ status }}
          </button>
        }
      </div>
    </div>
  }
</app-drawer>

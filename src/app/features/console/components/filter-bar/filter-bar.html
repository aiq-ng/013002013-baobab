<div class="flex flex-wrap items-center gap-2" role="group" [attr.aria-label]="label()">
  <button
    type="button"
    (click)="select(null)"
    [attr.aria-pressed]="active() === null"
    class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
    [class.bg-console-accent]="active() === null"
    [class.text-white]="active() === null"
    [class.bg-slate-100]="active() !== null"
    [class.text-slate-600]="active() !== null"
  >
    All
  </button>
  @for (option of options(); track option.value) {
    <button
      type="button"
      (click)="select(option.value)"
      [attr.aria-pressed]="active() === option.value"
      class="rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
      [class.bg-console-accent]="active() === option.value"
      [class.text-white]="active() === option.value"
      [class.bg-slate-100]="active() !== option.value"
      [class.text-slate-600]="active() !== option.value"
    >
      {{ option.label }}
    </button>
  }
</div>

<div class="console-segmented" role="group" [attr.aria-label]="label()">
  <button
    type="button"
    class="console-segment"
    (click)="select(null)"
    [attr.aria-pressed]="active() === null"
  >
    All
  </button>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="console-segment"
      (click)="select(option.value)"
      [attr.aria-pressed]="active() === option.value"
    >
      {{ option.label }}
    </button>
  }
</div>

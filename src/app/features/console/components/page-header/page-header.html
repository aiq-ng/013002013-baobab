<header class="mb-6 sm:mb-8">
  @if (backLink(); as link) {
    <a
      [routerLink]="link"
      class="console-link mb-3 text-sm !text-console-muted hover:!text-ink-950"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        class="size-4"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 10H4m5-5-5 5 5 5" />
      </svg>
      {{ backLabel() }}
    </a>
  }
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0">
      @if (eyebrow()) {
        <p class="console-eyebrow mb-1.5">{{ eyebrow() }}</p>
      }
      <h1 class="text-2xl font-semibold tracking-tight text-balance text-ink-950 sm:text-3xl">
        {{ title() }}
        <ng-content select="[titleSuffix]" />
      </h1>
      @if (meta()) {
        <p class="mt-1.5 text-sm text-console-muted">{{ meta() }}</p>
      }
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-3">
      <ng-content select="[actions]" />
    </div>
  </div>
</header>

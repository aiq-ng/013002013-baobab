<section class="mx-auto max-w-4xl pt-4 sm:pt-10">
  <div class="relative overflow-hidden rounded-2xl bg-console-tint px-5 py-8 sm:px-10 sm:py-10">
    <svg
      aria-hidden="true"
      viewBox="0 0 200 200"
      class="pointer-events-none absolute -top-6 -right-10 hidden size-56 text-console-tint-strong sm:block"
    >
      <circle cx="100" cy="100" r="100" fill="currentColor" />
      <path
        d="m55 102 32 32 60-66"
        fill="none"
        stroke="white"
        stroke-opacity="0.7"
        stroke-width="18"
      />
    </svg>
    <div class="relative flex flex-col gap-5 sm:flex-row sm:items-start sm:gap-7">
      <span
        aria-hidden="true"
        class="flex size-14 shrink-0 items-center justify-center rounded-full bg-console-accent/15 sm:size-16"
      >
        <span
          class="flex size-10 items-center justify-center rounded-full bg-console-accent-strong text-white sm:size-11"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            class="size-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5L20 7" />
          </svg>
        </span>
      </span>
      <div class="min-w-0 sm:pr-40">
        <p class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="console-eyebrow">{{ eyebrow() }}</span>
          @if (tag()) {
            <span class="text-sm text-ink-950">{{ tag() }}</span>
          }
        </p>
        <h1
          #heading
          tabindex="-1"
          class="mt-2 text-2xl font-semibold tracking-tight text-ink-950 outline-none sm:text-3xl"
        >
          {{ title() }}
        </h1>
        <div class="mt-2 text-base text-console-muted">
          <ng-content />
        </div>
      </div>
    </div>
  </div>
  <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
    <ng-content select="[actions]" />
  </div>
  <ng-content select="[note]" />
</section>

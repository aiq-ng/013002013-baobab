<div class="mx-auto mt-24 max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-lg font-semibold text-ink-950">Registry Console</h1>
  <p class="mt-1 text-sm text-slate-500">Sign in to continue.</p>

  <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="email" class="block text-sm font-medium text-ink-950">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-ink-950">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"
      />
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
    }

    <app-button
      type="submit"
      [label]="submitting() ? 'Signing in…' : 'Sign in'"
      [disabled]="submitting()"
      class="block"
    />
  </form>
</div>

<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white pad-card shadow-sm">
    <img
      ngSrc="/images/shared/logo-baobab.png"
      alt="Baobab"
      width="260"
      height="66"
      priority
      appImgFadeIn
      class="h-8 w-auto"
    />

    <h1 class="mt-6 text-2xl font-bold text-ink-950">Sign in to Baobab Admin</h1>
    <p class="mt-1 text-sm text-slate-500">
      Secretariat dispatch, Programs &amp; Resources management.
    </p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label for="email" class="block text-xs font-semibold tracking-wide text-slate-500"
          >OFFICIAL EMAIL ADDRESS</label
        >
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold tracking-wide text-slate-500"
          >PASSWORD</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
      }

      <app-button
        type="submit"
        [label]="submitting() ? 'Signing in…' : 'Sign in →'"
        [disabled]="submitting()"
        class="block [&_button]:w-full"
      />
    </form>
  </div>
</div>

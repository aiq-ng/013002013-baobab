<app-console-page-header
  eyebrow="Track 1.5"
  title="Access requests"
  meta="Pending accreditation reviews, oldest first."
/>

@if (loadError(); as message) {
  <div class="console-card">
    <app-status-panel
      variant="error"
      title="The review queue didn't load"
      [message]="message"
      actionLabel="Try again"
      (action)="reload()"
    />
  </div>
} @else {
  <app-data-table
    caption="Pending access requests"
    [columns]="columns"
    [rows]="rows()"
    [rowKey]="rowKey"
    [rowLabel]="rowLabel"
    [loading]="loading()"
    emptyMessage="No pending access requests — the queue is clear."
    (rowActivated)="open($event)"
  />
}

<app-decision-panel
  [request]="selected()"
  [deciding]="deciding()"
  (decided)="onDecided($event)"
  (closed)="selected.set(null)"
/>

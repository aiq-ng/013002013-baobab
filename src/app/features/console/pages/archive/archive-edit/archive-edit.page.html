<div class="max-w-3xl">
  <app-console-page-header
    [title]="isNew ? 'New archive entry' : 'Edit archive entry'"
    [meta]="
      isNew
        ? 'Files a new accord in the public Treaties & Conciliation Archive.'
        : (entry()?.refCode ?? '')
    "
    backLink="/console/archive"
    backLabel="Treaties Archive"
  />

  @if (loadError(); as message) {
    <div class="console-card">
      <app-status-panel
        variant="error"
        title="Could not load the entry"
        [message]="message"
        actionLabel="Try again"
        (action)="load()"
      />
    </div>
  } @else if (notFound()) {
    <div class="console-card">
      <app-status-panel
        title="This entry no longer exists"
        message="It may have been deleted by another editor."
      />
    </div>
  } @else if (loading()) {
    <p role="status" class="text-sm text-console-muted">Loading entry…</p>
  } @else {
    <form
      class="console-card pad-card space-y-6"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <app-console-field
          fieldId="refCode"
          label="Ref code"
          placeholder="e.g. REF: BBG-LQ-2023-TRX"
          [maxLength]="limits.refCode"
          [control]="form.controls.refCode"
        />
        <div>
          <label for="category" class="console-label">Category</label>
          <select
            id="category"
            formControlName="category"
            class="console-input"
            aria-required="true"
          >
            @for (category of categories; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </div>
        <app-console-field
          fieldId="regionTag"
          label="Region tag"
          placeholder="e.g. Sahel Central Basin"
          [maxLength]="limits.regionTag"
          [control]="form.controls.regionTag"
        />
        <app-console-field
          fieldId="statusTag"
          label="Status tag"
          placeholder="e.g. Ratified: November 2023 · In Active Force"
          [maxLength]="limits.statusTag"
          [control]="form.controls.statusTag"
        />
      </div>

      <app-console-field
        fieldId="title"
        label="Title"
        placeholder="e.g. Liptako-Gourma Tri-Border Accord & Customary Grazing Charter"
        [maxLength]="limits.title"
        [control]="form.controls.title"
      />
      <app-console-field
        fieldId="description"
        label="Description"
        [rows]="5"
        [maxLength]="limits.description"
        [control]="form.controls.description"
      />
      <app-console-field
        fieldId="ratifyingParties"
        label="Ratifying parties"
        placeholder="e.g. Delegations of Mali, Niger, Burkina Faso"
        [maxLength]="limits.ratifyingParties"
        [control]="form.controls.ratifyingParties"
      />
      <app-console-field
        fieldId="workingLanguages"
        label="Working languages"
        placeholder="e.g. Français, Hausa, Fulfulde, Tamasheq"
        [maxLength]="limits.workingLanguages"
        [control]="form.controls.workingLanguages"
      />

      <div
        class="flex flex-col-reverse gap-3 border-t border-console-line pt-5 sm:flex-row sm:items-center sm:justify-between"
      >
        <p class="text-sm text-console-muted">
          {{
            isNew
              ? 'New entries are published immediately.'
              : 'Changes go live as soon as you save.'
          }}
        </p>
        <app-button
          type="submit"
          variant="console"
          [label]="isNew ? 'Create entry' : 'Save entry'"
          busyLabel="Saving…"
          [busy]="submitting()"
        />
      </div>
    </form>
  }
</div>

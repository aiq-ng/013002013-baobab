<section class="mx-auto max-w-7xl px-4 pb-16">
  <div class="relative overflow-hidden rounded-card shadow-sm">
    @if (isPlaying()) {
      <video
        [autoplay]="true"
        controls
        class="aspect-video w-full bg-black object-cover"
        src="/videos/about/tillaberi-conciliation.mp4"
        [attr.aria-label]="caption"
      ></video>
    } @else {
      <div class="relative aspect-video w-full">
        <img
          ngSrc="/images/about/documentary-poster.jpg"
          [alt]="caption"
          fill
          priority
          class="object-cover"
        />
        <button
          type="button"
          (click)="play()"
          [attr.aria-label]="'Play: ' + caption"
          class="absolute inset-0 flex items-center justify-center focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        >
          <span
            class="flex h-16 w-16 items-center justify-center rounded-full bg-white/90 text-ink-950 shadow-lg transition-transform hover:scale-105"
          >
            <svg viewBox="0 0 24 24" class="ml-1 h-6 w-6 fill-current" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
          </span>
        </button>
        <p
          class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3 text-xs text-white sm:text-sm"
        >
          {{ caption }}
        </p>
      </div>
    }
  </div>
</section>

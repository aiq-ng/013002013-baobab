<section class="mx-auto max-w-5xl px-4 py-16">
  <app-eyebrow text="OUR CORE VALUES" />
  <h2 class="mt-4 text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">Our values</h2>

  <ul
    class="mt-12 grid grid-flow-row grid-cols-1 gap-x-16 gap-y-10 md:grid-flow-col md:grid-cols-2 md:grid-rows-3"
  >
    @for (value of values; track value.text) {
      <li class="flex max-w-sm items-center gap-4 text-sm text-ink-950 sm:text-base">
        <span
          class="flex size-12 shrink-0 items-center justify-center rounded-xl"
          [class]="
            value.tone === 'gold' ? 'bg-gold-500 text-ink-950' : 'bg-console-accent text-white'
          "
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            @switch (value.icon) {
              @case ('africa') {
                <path
                  d="M9 2.5 6 3.5 3.5 6.5 3 10l2.5 3.5 3 .5 1.5 2-.5 3 2 3 2.5-.5 2-3.5 1-4 3-3-.5-2.5-2-.5-1.5-3L14 3.5l-2.5.5L9 2.5Zm9.5 12.5-1 3 .5 1.5 1.5-1.5-.5-3h-.5Z"
                />
              }
              @case ('handshake') {
                <path
                  d="M2 8.5 6 5l4 1.5 2-1 4.5 1L22 9v5l-2 1-5.5 4.5a1.6 1.6 0 0 1-2.2-.2l-.3-.3-.5.4a1.5 1.5 0 0 1-2.1-.2l-.4-.5-.4.2a1.5 1.5 0 0 1-1.9-.6L6 17l-.3.1A1.5 1.5 0 0 1 4 16.4L2 14V8.5Zm8.8.6-2.6 2.3a1 1 0 0 0 1.3 1.5l1.9-1.6 4.8 4.2 1.6-1.3-5-4.9-2 .1Z"
                />
              }
              @case ('bridge') {
                <path
                  d="M14 3h7v7l-2.6-2.6-4.2 4.2-2.8-2.8 4.2-4.2L14 3Zm-4 18H3v-7l2.6 2.6 4.2-4.2 2.8 2.8-4.2 4.2L10 21Z"
                />
              }
              @case ('baobab') {
                <path
                  d="M4 6c0-1.7 1.6-3 3.5-3 .8 0 1.6.3 2.2.7A4.6 4.6 0 0 1 12 3c.9 0 1.7.3 2.3.7.6-.4 1.4-.7 2.2-.7C18.4 3 20 4.3 20 6s-1.6 3-3.5 3c-.6 0-1.2-.1-1.7-.4l-.8.4v12h-4V9l-.8-.4c-.5.3-1.1.4-1.7.4C5.6 9 4 7.7 4 6Z"
                />
              }
              @case ('badge') {
                <path
                  d="m12 2 2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2L12 2Zm-1.2 12.6-2.7-2.7-1.4 1.4 4.1 4.1 6.6-6.6-1.4-1.4-5.2 5.2Z"
                />
              }
            }
          </svg>
        </span>
        {{ value.text }}
      </li>
    }
  </ul>
</section>

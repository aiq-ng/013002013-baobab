<section class="mx-auto max-w-7xl px-4 pb-16">
  <figure class="relative overflow-hidden rounded-card shadow-lg">
    <img
      ngSrc="/images/about/amani-africa-banner.jpg"
      alt="A patterned map of Africa printed above the words “Amani Africa”"
      width="2700"
      height="840"
      priority
      appImgFadeIn
      class="h-56 w-full object-cover sm:h-80 lg:h-[25rem]"
    />
    <figcaption
      class="absolute bottom-4 left-4 right-4 w-fit rounded-full bg-ink-950/60 px-3 py-1.5 text-xs font-medium text-white sm:bottom-5 sm:left-6 sm:text-sm"
    >
      {{ caption }}
    </figcaption>
  </figure>
</section>

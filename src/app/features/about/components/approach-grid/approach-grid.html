<section class="mx-auto max-w-7xl px-4 py-16">
  <h2 class="text-center text-2xl font-bold text-ink-950 sm:text-3xl md:text-4xl">
    Our distinctive approach
  </h2>

  <ul
    appStaggerReveal
    class="mt-12 grid auto-rows-fr grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3 lg:gap-12"
  >
    @for (approach of approaches; track approach.title) {
      <li>
        <app-card
          class="block h-full"
          [imageUrl]="approach.imageUrl"
          [imageAlt]="approach.imageAlt"
        >
          <h3 title class="pt-2 text-lg font-semibold text-brand-600">{{ approach.title }}</h3>
          <p body class="pb-4 text-sm text-ink-950 sm:text-base">{{ approach.description }}</p>
        </app-card>
      </li>
    }
  </ul>
</section>

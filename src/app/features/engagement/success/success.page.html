<section class="mx-auto flex max-w-2xl flex-col items-center gap-6 px-4 py-24 text-center">
  <span
    class="flex h-16 w-16 items-center justify-center rounded-full bg-brand-100 text-brand-700"
    aria-hidden="true"
  >
    <svg viewBox="0 0 24 24" fill="none" class="h-8 w-8" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  </span>

  <h1 class="text-3xl font-semibold text-ink-950">{{ copy().headline }}</h1>
  <p class="text-base text-ink-950/70">{{ copy().subtext }}</p>

  <p class="text-sm text-ink-950/60">
    Reference ID: <span class="font-mono font-medium text-ink-950">{{ referenceId() }}</span>
  </p>

  <div class="mt-4 flex flex-wrap items-center justify-center gap-4">
    <app-button label="Return home" routerLink="/" variant="primary" />
    <app-button [label]="copy().retryLabel" [routerLink]="copy().retryRoute" variant="secondary" />
  </div>
</section>

<app-modal [open]="!!submission()" label="Submission confirmation" (closed)="close()">
  @if (submission(); as active) {
    <ng-container>
      <span
        class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-brand-100 text-brand-700"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-8 w-8" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </span>

      <h2 class="mt-5 text-2xl font-bold text-ink-950">{{ copy().headline }}</h2>
      <p class="mx-auto mt-3 max-w-sm text-sm text-ink-950/60">{{ copy().subtext }}</p>

      <div
        class="mx-auto mt-6 w-full max-w-xs rounded-2xl border border-ink-950/10 bg-surface-tint px-4 py-3"
      >
        <p class="text-xs font-medium text-ink-950/50">Confirmation reference</p>
        <p class="mt-1 font-mono text-sm font-semibold text-brand-700">
          {{ active.referenceId }}
        </p>
      </div>

      <button
        type="button"
        (click)="returnHome()"
        class="mt-8 inline-flex w-full items-center justify-center gap-2 rounded-full bg-brand-600 px-6 py-3 text-sm font-medium text-white transition-colors hover:bg-brand-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
      >
        Return to homepage
      </button>
    </ng-container>
  }

  @if (submission()) {
    <div
      modal-footer
      class="mt-8 flex flex-col items-center gap-1 bg-ink-950 px-6 py-4 text-center text-xs text-white/70 sm:flex-row sm:justify-between sm:gap-4 sm:text-left"
    >
      <span class="shrink-0 text-sm font-semibold text-white">Baobab</span>
      <span>
        &copy; {{ currentYear }} The Baobab Group for Strategic Statecraft. All Sovereign Rights
        Reserved.
      </span>
    </div>
  }
</app-modal>

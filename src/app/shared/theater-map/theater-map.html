<div role="group" aria-label="Filter operational theaters" class="flex flex-wrap gap-2">
  @for (pill of filterPills(); track pill) {
    <button
      type="button"
      [attr.aria-pressed]="activeFilter() === pill"
      (click)="setFilter(pill)"
      class="rounded-full border px-4 py-2 text-xs font-semibold uppercase tracking-wide transition-colors"
      [class.bg-brand-600]="activeFilter() === pill"
      [class.text-white]="activeFilter() === pill"
      [class.border-brand-600]="activeFilter() === pill"
      [class.border-ink-950/15]="activeFilter() !== pill"
      [class.text-ink-950]="activeFilter() !== pill"
    >
      {{ pill }}
    </button>
  }
</div>

<div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
  @for (item of filteredTheaters(); track item.name) {
    <app-card [imageUrl]="item.imageUrl" [imageAlt]="item.name" [badgeText]="item.theater">
      <h3 title class="text-base font-semibold text-ink-950">{{ item.name }}</h3>
      <p body class="text-sm text-ink-950/70">{{ item.description }}</p>
      <a
        link
        [routerLink]="item.route"
        class="mt-1 text-sm font-semibold text-brand-700 hover:text-brand-800"
        >View Thematic Report →</a
      >
    </app-card>
  }
</div>

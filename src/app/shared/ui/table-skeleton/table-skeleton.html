<div role="status" class="divide-y divide-console-line">
  <span class="sr-only">{{ label() }}</span>
  @for (i of placeholders(); track i) {
    <div data-skeleton-row aria-hidden="true" class="flex items-center gap-4 px-4 py-4 sm:px-6">
      <span class="skeleton size-10 shrink-0 rounded-lg"></span>
      <span class="flex flex-1 flex-col gap-2">
        <span class="skeleton h-3.5 w-2/5 rounded"></span>
        <span class="skeleton h-3 w-3/5 rounded"></span>
      </span>
      <span class="skeleton hidden h-3 w-16 rounded sm:block"></span>
    </div>
  }
</div>

<section
  class="relative overflow-hidden rounded-card bg-gradient-to-br from-brand-700 to-brand-900 bg-cover bg-center px-6 py-16 text-center text-white sm:px-12 sm:py-24"
  [style.background-image]="backgroundImage ? 'url(' + backgroundImage + ')' : null"
>
  @if (backgroundImage) {
    <div class="absolute inset-0 bg-gradient-to-br from-brand-800/85 to-brand-950/90"></div>
  }
  <div class="relative">
    <h2 class="mx-auto max-w-3xl text-2xl font-bold sm:text-4xl">{{ heading }}</h2>
    @if (subtext) {
      <p class="mx-auto mt-4 max-w-xl text-sm text-brand-100 sm:text-base">{{ subtext }}</p>
    }
    <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <app-button
        class="inline-block whitespace-nowrap"
        [label]="primaryLabel"
        [variant]="backgroundImage ? 'mint' : 'primary'"
        [routerLink]="primaryRoute"
        [ctaId]="primaryCtaId"
        (pressed)="primaryPressed.emit()"
      />
      @if (secondaryLabel) {
        <app-button
          class="inline-block whitespace-nowrap"
          [label]="secondaryLabel"
          [variant]="backgroundImage ? 'outline-light' : 'secondary'"
          [routerLink]="secondaryRoute"
          [ctaId]="secondaryCtaId"
          (pressed)="secondaryPressed.emit()"
        />
      }
    </div>
  </div>
</section>

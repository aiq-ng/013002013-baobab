<section
  class="rounded-card bg-gradient-to-br from-brand-700 to-brand-900 px-6 py-12 text-center text-white sm:px-12"
>
  <h2 class="mx-auto max-w-2xl text-2xl font-bold sm:text-3xl">{{ heading }}</h2>
  @if (subtext) {
    <p class="mx-auto mt-3 max-w-xl text-sm text-brand-100 sm:text-base">{{ subtext }}</p>
  }
  <div class="mt-8 flex flex-col items-center justify-center gap-4 sm:flex-row">
    <app-button
      [label]="primaryLabel"
      variant="primary"
      [routerLink]="primaryRoute"
      (pressed)="primaryPressed.emit()"
    />
    @if (secondaryLabel) {
      <app-button
        [label]="secondaryLabel"
        variant="secondary"
        [routerLink]="secondaryRoute"
        (pressed)="secondaryPressed.emit()"
      />
    }
  </div>
</section>

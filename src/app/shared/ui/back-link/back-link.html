<a
  [routerLink]="routerLink"
  class="group inline-flex items-center gap-2 text-sm font-medium text-ink-950/60 transition-all duration-200 ease-premium hover:-translate-x-0.5 hover:text-brand-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
>
  <svg
    class="h-4 w-4 shrink-0 transition-transform duration-200 ease-premium group-hover:-translate-x-0.5"
    viewBox="0 0 20 20"
    fill="none"
    aria-hidden="true"
  >
    <path
      d="M12.5 15.5L7 10l5.5-5.5"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span>{{ label }}</span>
</a>

<div
  class="flex flex-col items-center px-6 py-12 text-center"
  [attr.role]="variant() === 'error' ? 'alert' : null"
>
  <span
    aria-hidden="true"
    class="flex size-12 items-center justify-center rounded-full"
    [class.bg-red-50]="variant() === 'error'"
    [class.text-red-600]="variant() === 'error'"
    [class.bg-console-tint]="variant() === 'empty'"
    [class.text-console-accent-strong]="variant() === 'empty'"
  >
    @if (variant() === 'error') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7.5v5m0 3.5h.01" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5">
        <path stroke-linejoin="round" d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" />
        <path stroke-linejoin="round" d="m3 7.5 9 4.5 9-4.5M12 12v9" />
      </svg>
    }
  </span>
  <p class="mt-4 text-base font-semibold text-ink-950">{{ title() }}</p>
  @if (message()) {
    <p class="mt-1 max-w-sm text-sm text-console-muted">{{ message() }}</p>
  }
  @if (actionLabel(); as label) {
    <button type="button" class="console-btn console-btn--soft mt-5" (click)="action.emit()">
      {{ label }}
    </button>
  }
</div>

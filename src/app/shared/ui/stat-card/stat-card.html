<div class="stat-card flex flex-col gap-1" [class]="containerClass">
  <p class="text-2xl font-bold sm:text-3xl">
    {{ value }}
    @if (unit) {
      <span class="text-base font-semibold uppercase">{{ unit }}</span>
    }
  </p>
  <p class="text-xs font-medium uppercase tracking-wide opacity-80 sm:text-sm">{{ label }}</p>
</div>

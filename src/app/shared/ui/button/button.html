@if (routerLink) {
  <a [routerLink]="routerLink" [class]="baseClass + ' ' + variantClass" (click)="onRoutedClick()">
    {{ label }}
  </a>
} @else {
  <button
    [type]="type"
    [disabled]="disabled"
    [class]="baseClass + ' ' + variantClass"
    (click)="onClick()"
  >
    {{ label }}
  </button>
}

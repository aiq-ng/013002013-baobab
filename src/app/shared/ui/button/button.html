@if (routerLink) {
  <a
    [routerLink]="routerLink"
    [class]="baseClass + ' ' + sizeClass + ' ' + variantClass"
    (click)="onRoutedClick()"
  >
    <ng-content select="[icon]" />
    {{ label }}
  </a>
} @else if (href) {
  <a
    [href]="href"
    [attr.download]="download ? '' : null"
    [class]="baseClass + ' ' + sizeClass + ' ' + variantClass"
    (click)="onRoutedClick()"
  >
    <ng-content select="[icon]" />
    {{ label }}
  </a>
} @else {
  <button
    [type]="type"
    [disabled]="inactive"
    [attr.aria-busy]="busy ? 'true' : null"
    [class]="baseClass + ' ' + sizeClass + ' ' + variantClass"
    (click)="onClick()"
  >
    @if (busy) {
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="size-4 animate-spin">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.3" stroke-width="3" />
        <path
          d="M21 12a9 9 0 0 0-9-9"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <ng-content select="[icon]" />
    }
    {{ displayLabel }}
  </button>
}

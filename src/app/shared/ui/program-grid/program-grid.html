<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
  @for (program of programs; track program.slug) {
    <article
      class="group relative aspect-[4/5] w-full overflow-hidden rounded-card shadow-sm sm:aspect-[3/4]"
    >
      <img
        [ngSrc]="program.imageUrl"
        [alt]="program.imageAlt"
        fill
        loading="lazy"
        class="object-cover transition-transform duration-300 group-hover:scale-105"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-ink-950/90 via-ink-950/20 to-transparent"
      ></div>
      <div class="absolute left-4 top-4">
        <app-badge [text]="program.badgeText" />
      </div>
      <div class="absolute inset-x-0 bottom-0 flex flex-col gap-2 p-5">
        <h3 class="text-lg font-semibold text-white sm:text-xl">{{ program.title }}</h3>
        <p class="text-sm text-white/80">{{ program.description }}</p>
        <a
          [routerLink]="['/programs', program.slug]"
          class="mt-1 inline-flex items-center gap-1 text-sm font-medium text-brand-400 hover:text-brand-300"
        >
          {{ ctaLabel }}
        </a>
      </div>
    </article>
  }
</div>

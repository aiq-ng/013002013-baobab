<article
  class="group flex flex-col overflow-hidden rounded-card border border-ink-950/10 bg-surface shadow-sm transition-all duration-300 ease-premium hover:-translate-y-1 hover:shadow-md"
>
  @if (imageUrl) {
    <div class="relative aspect-[4/3] w-full overflow-hidden">
      <img
        [ngSrc]="imageUrl"
        [alt]="imageAlt"
        fill
        loading="lazy"
        class="object-cover transition-transform duration-500 ease-premium group-hover:scale-105"
      />
      @if (badgeText) {
        <div class="absolute left-3 top-3">
          <app-badge [text]="badgeText" variant="accent-on-dark" />
        </div>
      }
    </div>
  }
  <div class="flex flex-1 flex-col gap-2 p-4">
    <ng-content select="[title]" />
    <ng-content select="[body]" />
    <ng-content select="[link]" />
    <ng-content />
  </div>
</article>

<section class="mx-auto max-w-7xl px-4 py-16">
  <div
    class="relative overflow-hidden rounded-card border border-white/10 bg-gradient-to-br from-ink-900 via-ink-950 to-brand-950 px-6 py-12 text-white shadow-2xl shadow-black/40 sm:px-12 sm:py-14"
  >
    <div
      class="pointer-events-none absolute -right-24 -top-24 h-80 w-80 rounded-full bg-brand-500/20 blur-3xl"
      aria-hidden="true"
    ></div>
    <div
      class="pointer-events-none absolute -bottom-32 left-1/4 h-72 w-72 rounded-full bg-brand-700/20 blur-3xl"
      aria-hidden="true"
    ></div>
    <div
      class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.06)_1px,transparent_0)] bg-[length:24px_24px]"
      aria-hidden="true"
    ></div>

    <div class="relative flex flex-wrap items-start justify-between gap-4">
      <p
        class="inline-flex items-center gap-2 rounded-full border border-brand-400/30 bg-brand-600/20 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-brand-300"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-brand-400"></span>
        Diplomatic Dispatches
      </p>
      <p class="font-mono text-xs tracking-wide text-white/40">Protocol ID: {{ protocolId }}</p>
    </div>

    <h2 class="relative mt-6 max-w-xl text-2xl font-bold tracking-tight sm:text-4xl">
      {{ heading }}
    </h2>
    <p class="relative mt-3 max-w-xl text-sm leading-relaxed text-white/60 sm:text-base">
      {{ subtext }}
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="relative mt-10 flex w-full max-w-lg flex-col gap-3 sm:flex-row sm:items-start"
    >
      <div class="flex-1">
        <label for="dispatch-email" class="sr-only">Delegation official email</label>
        <input
          id="dispatch-email"
          type="email"
          formControlName="email"
          placeholder="Enter delegation official email (e.g. name@diplomatie.gouv.ml)"
          class="w-full rounded-full border border-white/15 bg-white/[0.06] px-5 py-3.5 text-sm text-white shadow-inner shadow-black/20 backdrop-blur-sm transition placeholder:text-white/40 focus:border-brand-400/60 focus:bg-white/10 focus:outline-none focus:ring-2 focus:ring-brand-400/50"
        />
        @if (errorFor('email')) {
          <p role="alert" class="mt-2 text-sm text-red-300">{{ errorFor('email') }}</p>
        }
      </div>
      <app-button
        class="[&_button]:shadow-lg [&_button]:shadow-brand-900/40"
        label="Request Dispatches"
        type="submit"
        variant="primary"
      />
    </form>

    <ul
      class="relative mt-8 flex flex-wrap gap-x-8 gap-y-3 border-t border-white/10 pt-6 text-xs text-white/50"
    >
      <li class="inline-flex items-center gap-2">
        <svg
          class="h-4 w-4 text-brand-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3l7 3v5c0 4.5-3 8.25-7 9.5-4-1.25-7-5-7-9.5V6l7-3z"
          />
        </svg>
        Encrypted Delivery
      </li>
      <li class="inline-flex items-center gap-2">
        <svg
          class="h-4 w-4 text-brand-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8.5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4.5l3 2" />
        </svg>
        Vetted within 4 Hours
      </li>
      <li class="inline-flex items-center gap-2">
        <svg
          class="h-4 w-4 text-brand-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7" />
        </svg>
        Ministry Clearance Required
      </li>
    </ul>
  </div>
</section>

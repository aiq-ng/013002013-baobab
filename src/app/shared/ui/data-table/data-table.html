<div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
  <table class="w-full min-w-[640px] text-left text-sm">
    <thead class="border-b border-slate-200 bg-slate-50">
      <tr>
        @for (column of columns(); track column.key) {
          <th scope="col" class="px-4 py-3 font-medium text-slate-600">{{ column.header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track rowKey()(row)) {
        <tr
          tabindex="0"
          role="button"
          class="cursor-pointer border-b border-slate-100 last:border-0 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-brand-600"
          (click)="activate(row)"
          (keydown)="onRowKeydown($event, row)"
        >
          @for (column of columns(); track column.key) {
            <td class="px-4 py-3 text-ink-950">{{ column.cell(row) }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns().length" class="px-4 py-8 text-center text-slate-500">
            {{ emptyMessage() }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<div [class]="'flex flex-col ' + alignClass">
  <p
    class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-brand-700"
  >
    <span aria-hidden="true" class="h-1.5 w-1.5 flex-shrink-0 rounded-full bg-brand-600"></span>
    {{ eyebrow }}
  </p>
  <h2 class="mt-3 max-w-3xl text-2xl font-bold tracking-tight text-ink-950 sm:text-3xl">
    {{ heading }}
  </h2>
  @if (lead) {
    <p class="mt-3 max-w-2xl text-sm leading-relaxed text-ink-950/60 sm:text-base">{{ lead }}</p>
  }
</div>

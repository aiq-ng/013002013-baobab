<div
  aria-live="polite"
  role="status"
  class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col gap-2"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-lg px-4 py-3 text-sm text-white shadow-lg"
      [class.bg-emerald-600]="toast.variant === 'success'"
      [class.bg-red-600]="toast.variant === 'error'"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        aria-label="Dismiss"
        (click)="dismiss(toast.id)"
        class="text-white/80 hover:text-white"
      >
        &times;
      </button>
    </div>
  }
</div>

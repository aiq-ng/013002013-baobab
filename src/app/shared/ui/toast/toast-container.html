<div
  class="pointer-events-none fixed inset-x-4 top-20 z-[60] flex flex-col items-stretch gap-2 sm:inset-x-auto sm:right-6 sm:w-96"
>
  <div aria-live="assertive" role="alert" class="flex flex-col gap-2">
    @for (toast of errors(); track toast.id) {
      <ng-container *ngTemplateOutlet="item; context: { $implicit: toast }" />
    }
  </div>
  <div aria-live="polite" role="status" class="flex flex-col gap-2">
    @for (toast of successes(); track toast.id) {
      <ng-container *ngTemplateOutlet="item; context: { $implicit: toast }" />
    }
  </div>
</div>

<ng-template #item let-toast>
  <div class="toast" [attr.data-variant]="toast.variant">
    <span aria-hidden="true" class="toast__icon">
      @if (toast.variant === 'success') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          class="size-3.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5L20 7" />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          class="size-3.5"
        >
          <path stroke-linecap="round" d="M12 7v6m0 4h.01" />
        </svg>
      }
    </span>
    <p class="flex-1 text-sm leading-snug text-ink-950">{{ toast.message }}</p>
    <button type="button" aria-label="Dismiss" (click)="dismiss(toast.id)" class="toast__close">
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="size-4"
      >
        <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
</ng-template>

<div class="relative flex gap-4 pb-8">
  <div class="flex flex-col items-center">
    <span class="h-3 w-3 shrink-0 rounded-full bg-brand-600"></span>
    @if (!isLast) {
      <span data-connector class="mt-1 w-px flex-1 bg-ink-950/15"></span>
    }
  </div>
  <div class="pb-2">
    <p class="text-xs font-semibold uppercase tracking-wide text-brand-700">{{ date }}</p>
    <h4 class="mt-1 text-base font-semibold text-ink-950">{{ title }}</h4>
    <p class="mt-1 text-sm text-ink-950/70">{{ description }}</p>
  </div>
</div>

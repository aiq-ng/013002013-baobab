<div class="min-h-screen bg-slate-50">
  @if (session(); as s) {
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
      <nav class="flex items-center gap-6" aria-label="Registry Console">
        <span class="text-sm font-semibold text-ink-950">Registry Console</span>
        <a
          routerLink="/console/submissions"
          routerLinkActive="text-brand-600 font-medium"
          class="text-sm text-slate-600 hover:text-ink-950"
          >Submissions</a
        >
        <a
          routerLink="/console/access-requests"
          routerLinkActive="text-brand-600 font-medium"
          class="text-sm text-slate-600 hover:text-ink-950"
          >Access Requests</a
        >
      </nav>
      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-500">{{ s.email }}</span>
        <button
          type="button"
          (click)="signOut()"
          class="text-sm font-medium text-slate-600 hover:text-ink-950"
        >
          Sign out
        </button>
      </div>
    </header>
  }

  <main class="p-6">
    <router-outlet />
  </main>

  <app-toast-container />
</div>
